name: REA independent security review
'on':
  push:
    branches:
    - rea-security-baseline-20261014
    paths:
    - .github/workflows/rea-deep-security.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: rea-deep-security
  cancel-in-progress: false
jobs:
  unprivileged-security:
    if: github.repository == 'Giff3L/rea' && github.ref == 'refs/heads/rea-security-baseline-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
    - name: Check out only the fixed source without persisted Git credentials
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 6060de329de9f3636f63e24a2419847fd9d3f889
        persist-credentials: false
        submodules: false
        fetch-depth: 1
    - name: Use pinned Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .nvmrc
    - name: Use pinned npm
      run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
    - name: Create an unprivileged test user with clean source and synthetic probes
      timeout-minutes: 5
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 6060de329de9f3636f63e24a2419847fd9d3f889
        command -v strace || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends strace; }
        sudo useradd --create-home --shell /bin/bash rea-review
        sudo chmod 700 /home/rea-review
        sudo install -d -o rea-review -g rea-review -m 700 /home/rea-review/work /home/rea-review/evidence
        git archive HEAD | sudo tar -xf - -C /home/rea-review/work
        sudo chown -R rea-review:rea-review /home/rea-review/work
        sudo touch /root/rea-audit-denied-canary
        sudo chmod 600 /root/rea-audit-denied-canary
        printf 'AUDIT_NODE_BIN=%s\n' "$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/rea-deep-input"
        cat <<'AUDIT_RUNNER_EOF' > "$RUNNER_TEMP/rea-deep-input/run.sh"
        #!/usr/bin/env bash
        set -euo pipefail
        trap 'printf "Audit harness failed at line %s\n" "$LINENO" >&2' ERR
        cd /home/rea-review/work
        stage="$1"
        evidence=/home/rea-review/evidence
        logrun() {
          local label="$1"; shift
          set +e
          "$@" 2>&1 | tee "$evidence/$label.log"
          local result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > "$evidence/$label.exit"
          return "$result"
        }
        case "$stage" in
          identity)
            test "$(id -u)" -ne 0
            if sudo -n true 2>/dev/null; then echo 'Unexpected sudo authority' >&2; exit 1; fi
            if test -r /root/rea-audit-denied-canary; then echo 'Unexpected privileged file access' >&2; exit 1; fi
            printf 'sudo_denied=true\nprivileged_file_read_denied=true\n' > "$evidence/privilege-checks.txt"
            id > "$evidence/identity.txt"
            node --version > "$evidence/node-version.txt"
            npm --version > "$evidence/npm-version.txt"
            test "$(node --version)" = v24.18.0
            test "$(npm --version)" = 11.16.0
            git init -q
            git add .
            # Preserve the five pinned gitlinks without fetching or running submodules.
            git update-index --add --cacheinfo 160000,4fdab3d464d97b68e0af9088df3f9e2e1545b21c,third_party/binwalk
            git update-index --add --cacheinfo 160000,effeb734fc570c32650f88b159608979dc7b423e,third_party/ghidra-nativeaot
            git update-index --add --cacheinfo 160000,5844800a486d2248fa949b74c9896285f5b54de2,third_party/jadx-headless-mcp
            git update-index --add --cacheinfo 160000,1fcc7a0a584a70a96c31f5a276c20944d199a089,third_party/unblob
            git update-index --add --cacheinfo 160000,8219bf5016a063d7fb215101a8c45d5959ec733f,third_party/wakaru
            test "$(git write-tree)" = 1a0962b0bd2bddc5046c43a0d2be04eb0e8f2acb
            git -c user.name=REA-Audit -c user.email=audit@example.invalid commit -qm 'Fixed source fixture' --no-verify
            printf '%s\n' 6060de329de9f3636f63e24a2419847fd9d3f889 > "$evidence/source-commit.txt"
            git rev-parse 'HEAD^{tree}' > "$evidence/source-tree.txt"
            ;;
          install)
            logrun normal-install strace -f -qq -s 240 -e trace=execve,connect -o "$evidence/install-syscalls.log" npm ci --no-audit --no-fund --foreground-scripts
            ;;
          audit)
            set +e
            npm audit --json > "$evidence/source-npm-audit.json" 2> "$evidence/source-npm-audit.stderr"
            result=$?; printf '%s\n' "$result" > "$evidence/source-npm-audit.exit"; exit "$result"
            ;;
          build)
            logrun build npm run build:cached
            ;;
          independent)
            logrun independent-tests node node_modules/vitest/vitest.mjs run --config audit-probes/vitest.config.ts
            ;;
          boundaries)
            logrun focused-security npm run test:focused -- tests/boundary/sqlite/sqliteDatabaseInspection.test.ts tests/boundary/sqlite/sqliteDatabaseSnapshot.test.ts tests/boundary/sqlite/sqliteDatabaseDescriptorCleanup.test.ts tests/boundary/sqlite/sqliteDatabaseBusy.test.ts tests/boundary/sqlite/sqliteDatabaseCleanup.test.ts tests/boundary/filesystem/referenceSourceReader.test.ts tests/boundary/filesystem/referenceSourceFifoRace.test.ts tests/boundary/filesystem/referenceSourceUnreadableDirectories.test.ts tests/boundary/filesystem/referenceSourceCleanupOwnership.test.ts tests/boundary/filesystem/boundedFileBytes.test.ts tests/boundary/filesystem/clientConfigurationEnvironment.test.ts tests/boundary/browser/cdpEndpointResponseBounds.test.ts tests/boundary/browser/webSourceMapResponseCleanup.test.ts tests/boundary/browser/cdpProtocolFailure.test.ts tests/boundary/mcp/fridaLifecycleMcp.test.ts tests/boundary/process/processCaptureCapability.test.ts tests/boundary/process/processCaptureLifecycle.test.ts tests/boundary/process/processCaptureCancellationAdapters.test.ts tests/acceptance/sqliteDatabaseCli.test.ts tests/acceptance/setup/registrationRuntimeEnvironmentCli.test.ts
            ;;
          package)
            mkdir -p /home/rea-review/packages /home/rea-review/consumer
            logrun package-pack npm pack --pack-destination /home/rea-review/packages --json
            sha256sum /home/rea-review/packages/rea-agents-6.5.0.tgz > "$evidence/package-sha256.txt"
            tar -tzf /home/rea-review/packages/rea-agents-6.5.0.tgz > "$evidence/package-files.txt"
            cd /home/rea-review/consumer
            logrun consumer-install npm install --no-audit --no-fund --foreground-scripts /home/rea-review/packages/rea-agents-6.5.0.tgz
            cp package-lock.json "$evidence/consumer-package-lock.json"
            logrun installed-cli node node_modules/rea-agents/scripts/rea.mjs --version
            logrun installed-cli-help node node_modules/rea-agents/scripts/rea.mjs setup --help
            ;;
          consumer-audit)
            cd /home/rea-review/consumer
            set +e
            npm audit --omit=dev --json > "$evidence/consumer-npm-audit.json" 2> "$evidence/consumer-npm-audit.stderr"
            result=$?; printf '%s\n' "$result" > "$evidence/consumer-npm-audit.exit"; exit "$result"
            ;;
          frida)
            cp audit-probes/frida-smoke.mjs /home/rea-review/consumer/frida-smoke.mjs
            cd /home/rea-review/consumer
            logrun frida-instrumentation node frida-smoke.mjs
            ;;
          *) exit 2 ;;
        esac
        AUDIT_RUNNER_EOF
        cat <<'AUDIT_TESTS_EOF' > "$RUNNER_TEMP/rea-deep-input/security.test.ts"
        import { createHash } from 'node:crypto';
        import { mkdtemp, mkdir, readFile, writeFile, lstat, rm, symlink, rename } from 'node:fs/promises';
        import { tmpdir } from 'node:os';
        import { join } from 'node:path';
        import { Readable } from 'node:stream';
        import { DatabaseSync } from 'node:sqlite';
        import { afterEach, expect, it } from 'vitest';
        import { SafeOutputTree } from '../src/artifacts/SafeOutputTree.js';
        import { fetchWebSourceMaps } from '../src/browser/WebSourceMapFetcher.js';
        import { analyzeWebBundleInputSchema } from '../src/domain/webBundleAnalysis.js';
        import { inspectSqliteDatabaseSnapshot } from '../src/sqlite/SqliteDatabaseInspection.js';
        import { inspectSqliteDatabaseInputSchema } from '../src/domain/sqlite/sqliteDatabase.js';
        import { parseBinaryTarget } from '../src/application/BinaryTargetResolver.js';
        import { withArtifactClient } from '../tests/support/artifactClientScope.js';
        import { readReferenceSource } from '../tests/support/referenceSourceResourceScope.js';
        import { sanitizeBrowserUrl } from '../src/domain/browserObservation.js';
        import { makeProcessCaptureEnvironment } from '../src/process/capture/ProcessCaptureEnvironment.js';

        // Independent audit fixtures. Synthetic bytes and URLs only; no external hosts are contacted.
        const roots: string[] = [];
        async function root() { const p = await mkdtemp(join(tmpdir(), 'rea-independent-')); roots.push(p); return p; }
        afterEach(async () => { for (const p of roots.splice(0)) await rm(p, {recursive: true, force: true}); });
        const digest = (data: string | Buffer) => createHash('sha256').update(data).digest('hex');
        const payload = Buffer.from('synthetic fixture');
        const expected = {sha256: digest(payload), bytes: payload.length};
        const absent = async (p: string) => expect(lstat(p)).rejects.toMatchObject({code: 'ENOENT'});

        const badPaths = ['../canary', 'a/../../canary', '/tmp/rea-audit-escape', 'C:/escape',
          'Z:escape', '', '.', '..', './x', 'x/../canary', 'x/./y', 'x//y', '\0x', 'x\0y', '//host/share'];
        it.each(badPaths)('output writer refuses unsafe logical path %j', async name => {
          const p = await root(); const canary = join(p, 'canary'); await writeFile(canary, 'keep');
          const tree = await SafeOutputTree.create(join(p, 'out'));
          await expect(tree.write(name, Readable.from(payload), expected)).rejects.toThrow();
          await tree.rollback(); expect(await readFile(canary, 'utf8')).toBe('keep'); await absent(join(p, 'out'));
        });
        it('writes a nested file with private POSIX modes and verified bytes', async () => {
          const p = await root(); const tree = await SafeOutputTree.create(join(p, 'out'));
          await tree.write('a/b.txt', Readable.from(payload), expected); await tree.commit();
          expect(await readFile(join(p, 'out/a/b.txt'))).toEqual(payload);
          expect((await lstat(join(p, 'out'))).mode & 0o777).toBe(0o700);
          expect((await lstat(join(p, 'out/a/b.txt'))).mode & 0o777).toBe(0o600);
        });
        it.each(['digest', 'short', 'long'])('rolls back a failed %s integrity check', async kind => {
          const p = await root(); const tree = await SafeOutputTree.create(join(p, 'out'));
          const spec = {...expected, ...(kind === 'digest' ? {sha256: '0'.repeat(64)} : {bytes: payload.length + (kind === 'short' ? 1 : -1)})};
          await expect(tree.write('file', Readable.from(payload), spec)).rejects.toThrow();
          await tree.rollback(); await absent(join(p, 'out'));
        });
        it('refuses duplicate output instead of overwriting its first bytes', async () => {
          const p = await root(); const tree = await SafeOutputTree.create(join(p, 'out'));
          await tree.write('file', Readable.from(payload), expected);
          await expect(tree.write('file', Readable.from('replacement'), {sha256: digest('replacement'), bytes: 11})).rejects.toThrow();
          expect(await readFile(join(p, 'out/file'))).toEqual(payload); await tree.rollback();
        });
        it('refuses an existing symlink output root', async () => {
          const p = await root(); await mkdir(join(p, 'outside')); await symlink(join(p, 'outside'), join(p, 'out'));
          await expect(SafeOutputTree.create(join(p, 'out'))).rejects.toThrow();
          expect((await lstat(join(p, 'out'))).isSymbolicLink()).toBe(true);
        });
        it('refuses a substituted ancestor without following it during cleanup', async () => {
          const p = await root(); await mkdir(join(p, 'outside')); await writeFile(join(p, 'outside/canary'), 'keep');
          const tree = await SafeOutputTree.create(join(p, 'out'));
          await rename(join(p, 'out'), join(p, 'owned')); await symlink(join(p, 'outside'), join(p, 'out'));
          await expect(tree.write('new', Readable.from(payload), expected)).rejects.toThrow();
          await expect(tree.rollback()).rejects.toThrow();
          await absent(join(p, 'outside/new')); expect(await readFile(join(p, 'outside/canary'), 'utf8')).toBe('keep');
          await rm(join(p, 'out')); await rename(join(p, 'owned'), join(p, 'out')); await tree.rollback();
        });

        // Build stored ZIP bytes directly so a writer library cannot sanitize the entry name first.
        function zip(name: string, content = payload, badCrc = false) {
          const n = Buffer.from(name); let crc = 0xffffffff;
          for (const b of content) { crc ^= b; for (let k=0;k<8;k++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0); }
          crc = ((crc ^ 0xffffffff) >>> 0) ^ (badCrc ? 1 : 0); crc >>>= 0;
          const local = Buffer.alloc(30); local.writeUInt32LE(0x04034b50); local.writeUInt16LE(20,4); local.writeUInt16LE(0x800,6);
          local.writeUInt32LE(crc,14); local.writeUInt32LE(content.length,18); local.writeUInt32LE(content.length,22); local.writeUInt16LE(n.length,26);
          const central = Buffer.alloc(46); central.writeUInt32LE(0x02014b50); central.writeUInt16LE(20,4); central.writeUInt16LE(20,6); central.writeUInt16LE(0x800,8);
          central.writeUInt32LE(crc,16); central.writeUInt32LE(content.length,20); central.writeUInt32LE(content.length,24); central.writeUInt16LE(n.length,28);
          const end = Buffer.alloc(22); end.writeUInt32LE(0x06054b50); end.writeUInt16LE(1,8); end.writeUInt16LE(1,10); end.writeUInt32LE(central.length+n.length,12); end.writeUInt32LE(local.length+n.length+content.length,16);
          return Buffer.concat([local,n,content,central,n,end]);
        }
        async function extract(p: string, bytes: Buffer) {
          const inputPath = join(p, 'fixture.zip'); await writeFile(inputPath, bytes);
          const parsed = await parseBinaryTarget(inputPath); if (!parsed.ok) return parsed;
          return withArtifactClient(parsed.value, client => client.execute('extract_artifact', {output_root: join(p, 'out')}));
        }
        it.each(['../canary', 'a/../../canary', '/absolute', 'C:/absolute', 'C:relative', 'a//b', 'a/./b', 'a/../b', 'x\0y'])('archive extraction refuses raw ZIP path %j', async name => {
          const p = await root(); await writeFile(join(p, 'canary'), 'keep');
          const result = await extract(p, zip(name)); expect(result.ok).toBe(false);
          expect(await readFile(join(p, 'canary'), 'utf8')).toBe('keep'); await absent(join(p, 'out'));
        });
        it('extracts a raw ZIP positive control through the production provider', async () => {
          const p = await root(); const result = await extract(p, zip('nested/fixture.txt')); expect(result.ok).toBe(true);
          expect(await readFile(join(p, 'out/nested/fixture.txt'))).toEqual(payload);
        });
        it('rejects an archive CRC mismatch without publishing output', async () => {
          const p = await root(); const result = await extract(p, zip('fixture.txt', payload, true)); expect(result.ok).toBe(false); await absent(join(p, 'out'));
        });

        const origin = 'https://allowed.example.test';
        const webInput = analyzeWebBundleInputSchema.parse({cdp_endpoint:'http://127.0.0.1:9222', allowed_origins:[origin], target_id:'audit', fetch_source_maps:true});
        const request = (url: string) => ({scriptKey:'scr_'+'1'.repeat(64), declaredUrl:url, fetchUrl:url});
        const deniedUrls = ['file:///etc/passwd', 'data:application/json,{}', 'http://allowed.example.test/a',
         'https://allowed.example.test.evil.test/a', 'https://allowed.example.test@evil.test/a',
         'https://evil.test@allowed.example.test/a', 'https://allowed.example.test:444/a',
         'https://127.0.0.1/a', 'http://169.254.169.254/latest/meta-data/', 'http://[::1]/a',
         'https://allowed.example.test./a', 'javascript:alert(1)', 'not a URL'];
        it.each(deniedUrls)('does not fetch unauthorized source-map URL %j', async url => {
          const calls: string[] = [];
          const result = await fetchWebSourceMaps([request(url)], webInput, undefined, {fetch: async url => {calls.push(String(url)); return new Response('{}');}});
          expect(calls).toEqual([]); expect(result.items[0].status).toBe('policy_filtered');
        });
        it.each(deniedUrls.filter(url => url !== 'not a URL'))('reauthorizes redirect target %j', async target => {
          const calls: string[] = []; const start = origin+'/start.map';
          const result = await fetchWebSourceMaps([request(start)], webInput, undefined, {fetch: async (url, init) => {
            calls.push(String(url)); expect(init?.credentials).toBe('omit'); expect(init?.redirect).toBe('manual'); expect(init?.referrerPolicy).toBe('no-referrer');
            return new Response(null, {status:302, headers:{location:target}});
          }});
          expect(calls).toEqual([start]); expect(result.items[0].status).not.toBe('included');
        });
        it('enforces streamed byte budget even when content-length understates the response', async () => {
          let cancelled = false; let sent = false;
          const body = new ReadableStream({pull(c) { if (!sent) {sent=true; c.enqueue(new Uint8Array(8192));} }, cancel() {cancelled=true;}});
          const result = await fetchWebSourceMaps([request(origin+'/oversize.map')], webInput, undefined, {maxResponseBytes:4096, fetch:async () => new Response(body,{headers:{'content-length':'1'}})});
          expect(result.items[0].status).toBe('fetch_failed'); expect(result.items[0].artifact).toBe(null); expect(cancelled).toBe(true);
        });
        it('does not retrieve source-map external source URLs', async () => {
          const calls: string[] = [];
          const map = {version:3, names:[], sources:['file:///etc/passwd','http://169.254.169.254/credentials'], sourcesContent:[null,null], mappings:'AAAA'};
          const result = await fetchWebSourceMaps([request(origin+'/safe.map')], webInput, undefined, {fetch:async url => {calls.push(String(url)); return new Response(JSON.stringify(map));}});
          expect(calls).toEqual([origin+'/safe.map']); expect(result.items[0].status).toBe('included');
        });

        const quote = (s: string) => '"'+s.replaceAll('"','""')+'"';
        it.each(['x"; DROP TABLE victim;--', 'a.b', 'name\nline', '__proto__'])('treats SQLite table and column name %j as data', async name => {
          const p = await root(); const path = join(p, 'database.sqlite'); const db = new DatabaseSync(path);
          try { db.exec(`CREATE TABLE victim(x); INSERT INTO victim VALUES(7); CREATE TABLE ${quote(name)}(${quote(name)} TEXT);`); db.prepare(`INSERT INTO ${quote(name)} VALUES(?)`).run('fixture'); } finally {db.close();}
          const before = digest(await readFile(path));
          const result = inspectSqliteDatabaseSnapshot(path, inspectSqliteDatabaseInputSchema.parse({path, table:name, columns:[name], row_limit:1}));
          expect(result.rows?.returned_rows).toBe(1); expect(result.rows?.values[0][0]).toMatchObject({type:'text',value:'fixture'});
          expect(digest(await readFile(path))).toBe(before);
          const check = new DatabaseSync(path, {readOnly:true}); try {expect(check.prepare('SELECT x FROM victim').get()?.x).toBe(7);} finally {check.close();}
        });
        it('never executes a stored view that invokes extension loading', async () => {
          const p = await root(); const path = join(p,'database.sqlite'); const db = new DatabaseSync(path);
          try {db.exec("CREATE TABLE ordinary(x); INSERT INTO ordinary VALUES(1); CREATE VIEW hostile AS SELECT load_extension('/nonexistent/rea-audit-extension');");} finally {db.close();}
          const before = digest(await readFile(path));
          const inventory = inspectSqliteDatabaseSnapshot(path, inspectSqliteDatabaseInputSchema.parse({path, schema_scope:'database'}));
          expect(inventory.schema.views.map(v => v.name)).toContain('hostile');
          expect(() => inspectSqliteDatabaseSnapshot(path, inspectSqliteDatabaseInputSchema.parse({path, table:'hostile'}))).toThrow();
          expect(digest(await readFile(path))).toBe(before);
        });
        it('refuses SQL text disguised as a table selection', async () => {
          const p = await root(); const path = join(p,'database.sqlite'); const db = new DatabaseSync(path); db.exec('CREATE TABLE victim(x)'); db.close();
          expect(() => inspectSqliteDatabaseSnapshot(path, inspectSqliteDatabaseInputSchema.parse({path, table:'victim"; DROP TABLE victim;--'}))).toThrow();
          const check = new DatabaseSync(path, {readOnly:true}); try {expect(check.prepare('SELECT * FROM victim').all()).toEqual([]);} finally {check.close();}
        });
        it('reference traversal never reads file or directory symlink targets', async () => {
          const p = await root(); await mkdir(join(p,'source')); await mkdir(join(p,'outside')); await writeFile(join(p,'outside/private'), 'SYNTHETIC_PRIVATE_CANARY');
          await symlink(join(p,'outside/private'), join(p,'source/file-link')); await symlink(join(p,'outside'), join(p,'source/dir-link'));
          const result = await readReferenceSource(join(p,'source')); expect(result.ok).toBe(true); if (!result.ok) return;
          expect(result.value.bytesRead).toBe(0); expect(result.value.entries.map(e => e.kind)).toEqual(['symlink','symlink']);
        });

        // These two observations are intentional product properties and deployment risks, not test failures.
        it('documents that URL query and fragment secrets remain in analysis evidence', () => {
          const observed = sanitizeBrowserUrl('https://user:password@example.test/?token=SYNTHETIC_QUERY#SYNTHETIC_FRAGMENT');
          expect(observed.url).not.toContain('password'); expect(observed.url).toContain('SYNTHETIC_QUERY'); expect(observed.url).toContain('SYNTHETIC_FRAGMENT');
        });
        it('documents inherited environment authority in process capture', () => {
          const observed = makeProcessCaptureEnvironment({scenario:{environment:{}} as any, runId:'audit', hostEnvironment:{PATH:'/test', SYNTHETIC_SECRET:'SYNTHETIC_VALUE'}});
          expect(observed.SYNTHETIC_SECRET).toBe('SYNTHETIC_VALUE');
        });
        AUDIT_TESTS_EOF
        cat <<'AUDIT_CONFIG_EOF' > "$RUNNER_TEMP/rea-deep-input/vitest.config.ts"
        import { defineConfig } from 'vitest/config';
        export default defineConfig({test:{include:['audit-probes/security.test.ts'],pool:'forks',maxWorkers:1,testTimeout:20000,reporters:['default','json'],outputFile:{json:'/home/rea-review/evidence/independent-tests.json'}}});
        AUDIT_CONFIG_EOF
        cat <<'AUDIT_FRIDA_EOF' > "$RUNNER_TEMP/rea-deep-input/frida-smoke.mjs"
        import { spawn } from 'node:child_process';
        import { once } from 'node:events';
        import * as frida from 'frida';
        import { readFile } from 'node:fs/promises';
        const phase = name => console.log(JSON.stringify({phase:name,at:new Date().toISOString()}));
        phase('module_loaded');
        console.log(JSON.stringify({ptrace_scope:(await readFile('/proc/sys/kernel/yama/ptrace_scope','utf8')).trim()}));
        const child = spawn(process.execPath, ['-e', 'setInterval(()=>{},1000)'], {stdio:'ignore', env:{PATH:process.env.PATH}});
        let session; let script;
        const deadline = setTimeout(() => {child.kill('SIGKILL'); console.error('Frida fixture deadline'); process.exit(1);}, 60000);
        try {
          await once(child, 'spawn');
          phase('child_spawned');
          const device = await frida.getLocalDevice();
          phase('device_acquired');
          session = await device.attach(child.pid);
          phase('attached');
          script = await session.createScript('send({audit:"synthetic-only", pid:Process.id});');
          phase('script_created');
          const observed = new Promise((resolve,reject) => script.message.connect(message => {
            if (message.type === 'send') resolve(message.payload); else if (message.type === 'error') reject(new Error(message.description));
          }));
          await script.load();
          phase('script_loaded');
          const message = await observed;
          phase('message_received');
          if (message.audit !== 'synthetic-only' || message.pid !== child.pid) throw new Error('Unexpected Frida fixture identity');
          await script.unload(); script = undefined; await session.detach(); session = undefined;
          phase('detached');
          process.kill(child.pid, 0);
          console.log(JSON.stringify({ok:true, version:frida.version, fixture_instrumented:true, detached_target_alive:true}));
        } finally {
          if (script) await script.unload().catch(()=>{});
          if (session) await session.detach().catch(()=>{});
          child.kill('SIGKILL'); await once(child,'exit').catch(()=>{}); clearTimeout(deadline);
        }
        AUDIT_FRIDA_EOF
        sudo install -o root -g root -m 755 "$RUNNER_TEMP/rea-deep-input/run.sh" /home/rea-review/run.sh
        sudo install -d -o rea-review -g rea-review -m 700 /home/rea-review/audit-probes
        sudo install -o rea-review -g rea-review -m 600 "$RUNNER_TEMP/rea-deep-input/"{security.test.ts,vitest.config.ts,frida-smoke.mjs} /home/rea-review/audit-probes/
    - name: Verify non-root identity, denied privileged access and source tree
      id: identity
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh identity
    - name: Install with lifecycle scripts enabled and trace executed programs/network connects
      id: install
      timeout-minutes: 10
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh install
    - name: Refresh advisory check for the locked source graph
      id: audit
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh audit
    - name: Build the reviewed source as the unprivileged user
      id: build
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      timeout-minutes: 8
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh build
    - name: Copy independent test inputs after confirming the original source tree
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: sudo -u rea-review cp -r /home/rea-review/audit-probes /home/rea-review/work/audit-probes
    - name: Run independent negative probes and positive controls
      id: independent
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      timeout-minutes: 6
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh independent
    - name: Run additional production security boundaries under the non-root user
      id: boundaries
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      timeout-minutes: 15
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh boundaries
    - name: Pack and install into a fresh consumer directory with normal lifecycle scripts
      id: package
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      timeout-minutes: 12
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh package
    - name: Audit the freshly resolved installed consumer dependencies
      id: consumeraudit
      if: ${{ !cancelled() && steps.package.outcome == 'success' }}
      timeout-minutes: 3
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh consumer-audit
    - name: Instrument and detach only our own disposable Node fixture with real Frida
      id: frida
      if: ${{ !cancelled() && steps.package.outcome == 'success' }}
      timeout-minutes: 2
      run: sudo -u rea-review env -i HOME=/home/rea-review PATH="$AUDIT_NODE_BIN:/usr/local/bin:/usr/bin:/bin" CI=1 TURBO_TELEMETRY_DISABLED=1
        bash /home/rea-review/run.sh frida
    - name: Collect evidence and real stage exit codes
      if: ${{ always() }}
      run: |
        mkdir -p "$RUNNER_TEMP/rea-deep-audit"
        if sudo test -d /home/rea-review/evidence; then
          sudo cp -a /home/rea-review/evidence/. "$RUNNER_TEMP/rea-deep-audit/"
          sudo chown -R "$(id -un):$(id -gn)" "$RUNNER_TEMP/rea-deep-audit"
        fi
        cat <<'SCOPE' >> "$GITHUB_STEP_SUMMARY"
        ## Independent REA security review
        Fixed source: 6060de329de9f3636f63e24a2419847fd9d3f889.
        Fresh hosted Ubuntu 24.04 runner. Product/dependency execution uses a distinct non-root account with an empty inherited environment except explicit PATH/HOME/CI/telemetry configuration.
        No repository secrets, personal files, agent accounts or Jarvis access are supplied. Lifecycle scripts and normal consumer installation are enabled. Outbound network access is not contained. The runner's administrative orchestration remains separate from product execution.
        Independent synthetic probes cover output/ZIP traversal and integrity, symlinks and cleanup, SQLite identifier injection and view execution, source-map origin/redirect authorization and streaming limits, and observed data/environment exposure.
        Source-map fetches use a recording transport; they do not establish browser/DNS/real-network security. Frida instruments only a disposable fixture started by this job.
        | Stage | Outcome |
        | --- | --- |
        | Unprivileged identity | ${{ steps.identity.outcome }} |
        | Normal source install | ${{ steps.install.outcome }} |
        | Source dependency audit | ${{ steps.audit.outcome }} |
        | Build | ${{ steps.build.outcome }} |
        | Independent probes | ${{ steps.independent.outcome }} |
        | Additional boundary tests | ${{ steps.boundaries.outcome }} |
        | Consumer install and CLI | ${{ steps.package.outcome }} |
        | Consumer dependency audit | ${{ steps.consumeraudit.outcome }} |
        | Real Frida fixture | ${{ steps.frida.outcome }} |
        No claim of absence of all vulnerabilities or of a sandbox is made.
        SCOPE
    - name: Retain audit evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rea-deep-security-${{ github.run_id }}
        path: ${{ runner.temp }}/rea-deep-audit/
        if-no-files-found: warn
        retention-days: 7
